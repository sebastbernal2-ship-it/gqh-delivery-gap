<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The field: forces, pushes, phases, chains</title>
<style>
 :root{--bg:#0b0e13;--panel:#121722;--line:#232b3a;--text:#e6edf3;--dim:#8b949e;--drive:#3fb950;--dampen:#f85149;
  --gate:#d29922;--sub:#a371f7;--reveal:#58a6ff;--crowd:#39c5cf;--fin:#2dd4bf;--price:#e3b341;--mix:#db6d28;}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
 header{padding:1.1rem 1.4rem;border-bottom:1px solid var(--line);display:flex;gap:2rem;flex-wrap:wrap;align-items:baseline}
 header h1{font-size:1.15rem;margin:0}
 header .meta{color:var(--dim);font-size:.82rem}
 main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;height:calc(100vh - 62px)}
 #left{position:relative;overflow:hidden;border-right:1px solid var(--line)}
 #right{overflow:auto;padding:1rem 1.1rem 3rem}
 .controls{position:absolute;top:.7rem;left:.7rem;z-index:5;background:rgba(18,23,34,.92);border:1px solid var(--line);
  border-radius:10px;padding:.6rem .7rem;font-size:.78rem;max-width:330px}
 .controls label{display:inline-flex;align-items:center;gap:.3rem;margin:.1rem .45rem .1rem 0;cursor:pointer}
 .controls select,.controls input[type=range],.controls input[type=text]{background:#0e131c;color:var(--text);
  border:1px solid var(--line);border-radius:6px;padding:.15rem .3rem;font-size:.78rem}
 .legend{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.4rem;color:var(--dim)}
 .legend span{display:inline-flex;align-items:center;gap:.3rem}
 .swatch{width:12px;height:3px;border-radius:2px;display:inline-block}
 svg{display:block;width:100%;height:100%}
 .edge{stroke-opacity:.55}
 .edge.dim{stroke-opacity:.06}
 .node circle{stroke:#0b0e13;stroke-width:1.5;cursor:pointer}
 .node text{fill:var(--dim);font-size:8.5px;pointer-events:none}
 .node.hidden{display:none}
 h2{font-size:.95rem;margin:1.1rem 0 .4rem}
 h3{font-size:.85rem;margin:.9rem 0 .3rem;color:var(--text)}
 .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;margin:.45rem 0}
 .card .why{color:var(--dim);font-size:.78rem}
 .io{display:grid;grid-template-columns:1fr;gap:.25rem;font-size:.78rem}
 .io div span{color:var(--dim)}
 .pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:.05rem .45rem;margin:.1rem .15rem;
  font-size:.72rem;cursor:pointer;color:var(--text);background:#0e131c}
 .pill:hover{border-color:#58a6ff}
 .chain{border-left:2px solid var(--line);padding-left:.6rem;margin:.6rem 0}
 .chain .hops{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
 .arrow{color:var(--dim)}
 table{border-collapse:collapse;width:100%;font-size:.72rem;margin-top:.3rem}
 th,td{border:1px solid var(--line);padding:.16rem .3rem;text-align:left;white-space:nowrap}
 th{background:#0e131c;color:var(--dim);font-weight:500}
 td.pos{background:rgba(63,185,80,.22)} td.neg{background:rgba(248,81,73,.22)} td.zero{background:#0e131c;color:var(--dim)}
</style></head><body>
<header>
 <h1>The field</h1>
 <div class="meta" id="headline"></div>
 <div class="meta">every edge is an inference: it carries a condition, an assumption and a kill. Click any force.</div>
</header>
<main>
 <div id="left">
  <div class="controls">
   <div><input id="search" type="text" placeholder="search a force" style="width:150px">
    load at least <input id="load" type="range" min="1" max="5" value="1" style="width:80px"><span id="loadval">1</span>
    phase <select id="phase"><option value="">stable only</option><option value="shortage">shortage</option>
     <option value="buildout">buildout</option><option value="overbuild">overbuild</option>
     <option value="shakeout">shakeout</option><option value="second_wave">second wave</option></select></div>
   <div id="relations" style="margin-top:.3rem"></div>
   <div class="legend" id="legend"></div>
  </div>
  <svg id="map"></svg>
 </div>
 <div id="right">
  <div id="detail"></div>
  <h2>Chains, the intuition made addressable</h2>
  <div id="chains"></div>
  <h2>Phase field, net sign per force</h2>
  <div id="matrix"></div>
 </div>
</main>
<script>
const DATA = {"forces":[{"id":"force:demand:token-volume","domain":"demand","name":"Token volume","meaning":"the volume of inference and training tokens demanded","direction":"pushes compute, power and rental demand up","observables":"provider token disclosures, inference API traffic, model releases","payer":"rental capacity owners","out_interactions":5,"in_interactions":2,"degree":7},{"id":"force:demand:inference-price-elasticity","domain":"demand","name":"Inference price elasticity","meaning":"how much usage expands when the price per token falls","direction":"pushes usage up as price falls","observables":"price per million tokens against usage growth","payer":"end users","out_interactions":2,"in_interactions":1,"degree":3},{"id":"force:demand:model-efficiency","domain":"demand","name":"Model efficiency","meaning":"tokens produced per unit of energy and silicon","direction":"dampens compute demand per unit of output","observables":"tokens per watt, model architecture releases","payer":"capacity owners","out_interactions":2,"in_interactions":1,"degree":3},{"id":"force:demand:enterprise-adoption","domain":"demand","name":"Enterprise adoption","meaning":"the share of enterprise workloads that use models in production","direction":"pushes durable demand up","observables":"enterprise software disclosures, survey data","payer":"software and cloud vendors","out_interactions":1,"in_interactions":0,"degree":1},{"id":"force:demand:agentic-workloads","domain":"demand","name":"Agentic workloads","meaning":"always-on agents that consume compute continuously rather than in bursts","direction":"pushes baseload compute and power demand up","observables":"agent product launches, API concurrency","payer":"capacity owners","out_interactions":1,"in_interactions":0,"degree":1},{"id":"force:demand:consumer-apps","domain":"demand","name":"Consumer AI usage","meaning":"consumer usage of generative products","direction":"pushes bursty demand up","observables":"app download and engagement data","payer":"consumer platforms","out_interactions":1,"in_interactions":0,"degree":1},{"id":"force:demand:sovereign-ai","domain":"demand","name":"Sovereign AI","meaning":"national programs building domestic compute capacity","direction":"pushes demand up and diversifies the buyer set","observables":"government tenders, national compute plans","payer":"taxpayers","out_interactions":3,"in_interactions":0,"degree":3},{"id":"force:demand:training-scale","domain":"demand","name":"Frontier training scale","meaning":"the frontier scale of training runs","direction":"pushes concentrated high-end demand up","observables":"model card disclosures, cluster announcements","payer":"model labs","out_interactions":2,"in_interactions":0,"degree":2},{"id":"force:silicon:hbm-supply","domain":"silicon","name":"HBM supply","meaning":"high bandwidth memory capacity","direction":"gates accelerator output","observables":"memory maker guidance, HBM capacity announcements","payer":"accelerator buyers","out_interactions":1,"in_interactions":2,"degree":3},{"id":"force:silicon:cowos-packaging","domain":"silicon","name":"Advanced packaging capacity","meaning":"CoWoS and equivalent packaging lines","direction":"gates accelerator output","observables":"foundry packaging capacity disclosures","payer":"accelerator vendors","out_interactions":1,"in_interactions":0,"degree":1},{"id":"force:silicon:accelerator-lead-time","domain":"silicon","name":"Accelerator lead time","meaning":"quoted delivery time for accelerators","direction":"signals scarcity and pushes rental prices up","observables":"vendor lead time commentary, reseller quotes","payer":"capacity buyers","out_interactions":2,"in_interactions":4,"degree":6},{"id":"force:silicon:accelerator-resale-value","domain":"silicon","name":"Accelerator resale value","meaning":"secondary market price of installed accelerators","direction":"reveals the economic life and financing quality of the fleet","observables":"resale marketplaces, auction data","paye ,"observables":"queue milestone dates, utility reports","payer":"capacity owners and tenants","out_interactions":2,"in_interactions":5,"degree":7},{"id":"force:power:firm-capacity-scarcity","domain":"power","name":"Firm capacity scarcity","meaning":"the shortage of dispatchable capacity at peak","direction":"pushes capacity prices and contract values up","observables":"capacity auction results, reserve margins","payer":"loads paying capacity","out_interactions":1,"in_interactions":4,"degree":5},{"id":"force:power:gas-turbine-slot","domain":"power","name":"Gas turbine slot","meaning":"the booked manufacturing slots for heavy duty turbines","direction":"gates new dispatchable power","observables":"turbine vendor backlogs and slot disclosures","payer":"developers","out_interactions":1,"in_interactions":3,"degree":4},{"id":"force:power:nuclear-ppa","domain":"power","name":"Nuclear PPA","meaning":"long dated power contracts with nuclear plants","direction":"prices firm power above merchant and anchors tenant economics","observables":"PPA announcements, utility filings","payer":"ratepayers and tenants","out_interactions":2,"in_interactions":1,"degree":3},{"id":"force:power:merchant-power-price","domain":"power","name":"Merchant power price","meaning":"the spot and forward price of power in merchant markets","direction":"reveals scarcity and drives margin for unhedged generation","observables":"power futures, nodal prices","payer":"merchant generators","out_interactions":2,"in_interactions":3,"degree":5},{"id":"force:power:capacity-auction","domain":"power","name":"Capacity auction","meaning":"the market that pays for firm capacity","direction":"prices reliability and reveals scarcity","observables":"auction clearing prices","payer":"loads","out_interactions":2,"in_interactions":0,"degree":2},{"id":"force:power:grid-operator-reform","domain":"power","name":"Grid operator reform","meaning":"queue reform, fast track lanes and cluster studies","direction":"accelerates or gates interconnections","observables":"tariff filings, FERC and RTO orders","payer":"developers","out_interactions":3,"in_interactions":1,"degree":4},{"id":"force:power:onsite-generation","domain":"power","name":"On site generation","meaning":"behind the meter generation built by the load itself","direction":"bypasses the queue and shifts the bottleneck to fuel and equipment","observables":"permit filings, genset orders","payer":"site owners","out_interactions":2,"in_interactions":8,"degree":10},{"id":"force:power:power-cost-pass-through","domain":"power","name":"Power cost pass through","meaning":"the contract structure that passes energy cost to tenants","direction":"protects provider margin and moves volatility to tenants","observables":"lease and service contracts","payer":"tenants","out_interactions":1,"in_interactions":0,"degree":1},{"id":"force:grid:transformer-lead-time","domain":"grid","name":"Transformer lead time","meaning":"quoted delivery time for large power and distribution transformers","direction":"gates energization and prices scarcity into equipment","observables":"supplier backlogs, order slot disclosures","payer":"project developers and ratepayers","out_interactions":4,"in_interactions":3,"degree":7},{"id":"force:grid:hvdc-lead-time","domain":"grid","name":"HVDC lead time","meaning":"delivery time for converters, cables and ships","direction":"gates long haul transfer","observables":"converter and cable order books, vessel bookings","payer":"transmission customers","out_interactions":1,"in_interactions":1,"degree":2},{"id":"force:grid:switchgear-supply","domain":"grid","name":"Switchgear supply","meaning":"medium and high voltage switchgear capacity","direction":"gates substation completion","observables":"supplier guidance, substation lead times","payer":"developers","out_interactions":1,"in_interactions":1,"degree":2},{"id":"force:grid:utility-capex-plan","domain":"grid","name":"Utility capex plan","meaning":"approved and proposed utility capital eatment charges","payer":"cable and winding buyers","out_interactions":2,"in_interactions":1,"degree":3},{"id":"force:materials:rare-earth-magnets","domain":"materials","name":"Rare earth magnets","meaning":"sintered magnet capacity and export policy","direction":"gates motors and generators","observables":"export quotas, magnet plant announcements","payer":"equipment makers","out_interactions":1,"in_interactions":0,"degree":1},{"id":"force:materials:aluminium-conductor","domain":"materials","name":"Aluminium conductor","meaning":"rod and conductor capacity","direction":"sets cable cost and speed","observables":"smelter and rod mill data, cable maker guidance","payer":"cable buyers","out_interactions":1,"in_interactions":2,"degree":3},{"id":"force:materials:silicon-carbide","domain":"materials","name":"Silicon carbide","meaning":"substrate and device capacity","direction":"gates efficient power conversion","observables":"substrate capacity, device qualifications","payer":"converter makers","out_interactions":2,"in_interactions":0,"degree":2},{"id":"force:materials:graphite-anode","domain":"materials","name":"Graphite anode","meaning":"synthetic and natural anode capacity","direction":"gates battery cells","observables":"anode plant announcements, export controls","payer":"cell makers","out_interactions":1,"in_interactions":1,"degree":2},{"id":"force:materials:coolant-chemistry","domain":"materials","name":"Coolant chemistry","meaning":"refrigerants, dielectrics and treatment chemicals","direction":"gates cooling design choices","observables":"chemical supplier qualifications, PFAS rules","payer":"cooling system buyers","out_interactions":1,"in_interactions":0,"degree":1},{"id":"force:materials:nuclear-fuel-enrichment","domain":"materials","name":"Enrichment capacity","meaning":"enrichment and fabrication capacity","direction":"gates fuel for restarts and new builds","observables":"enrichment contracts, government programmes","payer":"reactor operators","out_interactions":1,"in_interactions":0,"degree":1},{"id":"force:labor:construction-crews","domain":"labor","name":"Construction crews","meaning":"skilled crews for industrial and power construction","direction":"gates build rates and sets installed cost","observables":"union hiring halls, project labour agreements","payer":"project owners","out_interactions":1,"in_interactions":3,"degree":4},{"id":"force:labor:electricians","domain":"labor","name":"Electricians","meaning":"licensed electrical labour for substations and fitout","direction":"gates energization and fitout","observables":"apprenticeship registrations, wage data","payer":"project owners","out_interactions":1,"in_interactions":0,"degree":1},{"id":"force:labor:turbine-casters","domain":"labor","name":"Turbine casters","meaning":"specialist foundry labour for turbine components","direction":"gates turbine output","observables":"foundry employment, casting lead times","payer":"turbine makers","out_interactions":1,"in_interactions":2,"degree":3},{"id":"force:labor:epc-backlog","domain":"labor","name":"EPC backlog","meaning":"engineering procurement and construction order books","direction":"reveals demand and gates delivery","observables":"contractor disclosures","payer":"project owners","out_interactions":2,"in_interactions":1,"degree":3},{"id":"force:labor:union-wage-pressure","domain":"labor","name":"Wage pressure","meaning":"wage escalation in the scarce trades","direction":"pushes project cost and shifts margin","observables":"wage settlements, project labour agreements","payer":"project owners","out_interactions":2,"in_interactions":0,"degree":2},{"id":"force:sites:land-permitting","domain":"sites","name":"Land and permitting","meaning":"the time and risk of entitlements","direction":"gates site start dates","observables":"permit filings, planning agendas","payer":"developers","out_interactions":1,"in_interactions":4,"degree":5},{"id":"force:sites:community-opposition","domain":"sites","name":"Community opposition","meaning":"organised local resistance to projects","direction":"delays and sometimes kills sites","observables":"planning hearings, litigation","payer":"developers","out_interactions":2,"in_interactions":1,"degree":3},{"id":"force:sites:water-rights","domain":"sites","name":"Water rights","meaning":"the legal right to withdraw and discharge water","direction":"gates evaporative cooling designs","observables":"water permits, basin allocations","payer":"site operators","out_interactions":1,"in_interactions":0,"degree":1},{"id":"force:sites:fiber-routes","domain":"sites","name":"Fiber routes","meaning":"the availability of long haul and metro fibre","direction":"gates cluster placement and latency","observables":"route maps, right of way filings","payer":"network operators","out_interactions":1,"in_interactions":1,"degree":2},{"id":"force:sites:latency-geography","domain":"sites","name":"Latency geography","meaning":"where compute must sit to meet latency budgets","direction":"constrains site choice and creates land premia","observables":"latency maps, colocation footprints","payer":"tenants","out_interactions":2,"in_interactions":2,"degree":4},{"id":"force:water:cooling-water-availability","domain":"water","name":"Cooling water availability","meaning":"local water supply for cooling","direction":"gates site scale and technology","observables":"basin data, withdrawal permits","payer":"site operators","out_interactions":2,"in_interactions":1,"degree":3},{"id":"force:water:evaporative-limits","domain":"water","name":"Evaporative limits","meaning":"rules capping consumptive water use","direction":"pushes closed loop designs","observables":"regulatory limits, drought measures","payer":"site operators","out_interactions":1,"in_interactions":1,"degree":2},{"id":"force:water:closed-loop-retrofit","domain":"water","name":"Closed loop retrofit","meaning":"retrofitting cooling to reduce water use","direction":"raises capex and lowers water risk","observables":"retrofit announcements, design disclosures","payer":"site owners","out_interactions":1,"in_interactions":2,"degree":3},{"id":"force:water:waste-heat-reuse","domain":"water","name":"Waste heat reuse","meaning":"selling or reusing rejected heat","direction":"improves site economics and community standing","observables":"district heating contracts, heat reuse projects","payer":"site owners","out_interactions":1,"in_interactions":0,"degree":1},{"id":"force:financing:policy-rate","domain":"financing","name":"Policy rate","meaning":"the risk free rate that discounts every project","direction":"sets the hurdle and the multiple","observables":"central bank path, forward curve","payer":"all capital owners","out_interactions":4,"in_interactions":0,"degree":4},{"id":"force:financing:credit-spreads","domain":"financing","name":"Credit spreads","meaning":"the price of corporate and project credit","direction":"sets funding cost and deal access","observables":"index spreads, new issue concessions","payer":"borrowers","out_interactions":3,"in_interactions":0,"degree":3},{"id":"force:financing:abs-capacity","domain":"financing","name":"Securitisation capacity","meaning":"the depth of demand for data centre and equipment backed deals","direction":"converts contracted cash flows into upfront capital","observables":"ABS issuance, spread levels, rating actions","payer":"sponsors","out_interactions":2,"in_interactions":4,"degree":6},{"id":"force:financing:vendor-financing","domain":"financing","name":"Vendor financing","meaning":"supplier provided credit for equipment","direction":"accelerates purchases and hides end demand risk","observables":"vendor financing disclosures, terms","payer":"vendors and buyers","out_interactions":2,"in_interactions":0,"degree":2},{"id":"force:financing:reit-cost-of-capital","domain":"financing","name":"REIT cost of capital","meaning":"the equity and debt cost for listed landlords","direction":"decides who can build at a spread","observables":"REIT multiples, ATM issuance","payer":"REIT shareholders","out_interactions":2,"in_interactions":0,"degree":2},{"id":"force:financing:depreciation-schedule","domain":"financing","name":"Depreciation schedule","meaning":"the useful life assumption for assets in place","direction":"shifts reported earnings and loan covenants","observables":"annual report notes, policy changes","payer":"shareholders and lenders","out_interactions":1,"in_interactions":1,"degree":2},{"id":"force:financing:lease-accounting","domain":"financing","name":"Lease accounting","meaning":"how capacity commitments appear on balance sheets","direction":"shifts demand between structure and disclosure","observables":"lease notes, accounting changes","payer":"issuers and analysts","out_interactions":1,"in_interactions":0,"degree":1},{"id":"force:policy:investment-credits","domain":"policy","name":"Investment credits","meaning":"tax credits and subsidies for build","direction":"raises after tax returns and pulls build forward","observables":"legislation, guidance, qualifying lists","payer":"taxpayers","out_interactions":2,"in_interactions":0,"degree":2},{"id":"force:policy:tariffs-equipment","domain":"policy","name":"Equipment tariffs","meaning":"duties on imported equipment and materials","direction":"raises cost and reshapes sourcing","observables":"tariff schedules, exclusion decisions","payer":"buyers","out_interactions":2,"in_interactions":1,"degree":3},{"id":"force:policy:antitrust-scrutiny","domain":"policy","name":"Antitrust scrutiny","meaning":"regulatory attention on vertical integration and deals","direction":"slows consolidation and changes structuring","observables":"complaints, inquiries, remedies","payer":"shareholders","out_interactions":2,"in_interactions":0,"degree":2},{"id":"force:policy:grid-permitting-reform","domain":"policy","name":"Permitting reform","meaning":"statutory change to siting and approval timelines","direction":"compresses or extends project clocks","observables":"bill text, agency rules","paye ence":{"E4":147,"E2":2},"phase_conditional_interactions":14,"mean_load":3.13,"high_load_links":41,"assumptions_total":59,"assumptions_seeded":18,"assumptions_from_links":41,"chains":11,"chain_hops":53,"isolated_forces":[],"note":"every interaction is an inference with a condition, an assumption and a kill"}};
const RELCOLOR = {drives:"var(--drive)",dampens:"var(--dampen)",gates:"var(--gate)",delays:"var(--gate)",

 `${forces.length} forces in ${domains.length} domains, ${interactions.length} typed pushes, ${chains.length} chains, ${assumptions.length} assumptions, ` +

relBox.innerHTML = RELS.map(r=>`<label><input type="checkbox" class="rel" value="${r}" checked> <span class="swatch" style="background:${RELCOLOR[r]||"#666"}"></span>${r}</label>`).join("");
const legend = document.getElementById("legend");
legend.innerHTML = RELS.map(r=>`<span><span class="swatch" style="background:${RELCOLOR[r]||"#666"}"></span>${r}</span>`).join("");

// layout: domains on a ring, forces inside their domain, then springs
const W=1000,H=760, cx=W/2, cy=H/2, ring=Math.min(W,H)/2-90;
const pos={}; const domainCenter={};
domains.forEach((d,i)=>{const a=2*Math.PI*i/domains.length - Math.PI/2; domainCenter[d]={x:cx+ring*Math.cos(a),y:cy+ring*Math.sin(a)};});
domains.forEach(d=>{const members=forces.filter(f=>f.domain===d);members.forEach((f,j)=>{const a=2*Math.PI*j/Math.max(1,members.length);
 pos[f.id]={x:domainCenter[d].x+34*Math.cos(a),y:domainCenter[d].y+34*Math.sin(a)};});});
for(let step=0;step<260;step++){
 const disp={}; forces.forEach(f=>disp[f.id]={x:0,y:0});
 for(let i=0;i<forces.length;i++)for(let j=i+1;j<forces.length;j++){
  const a=forces[i].id,b=forces[j].id,dx=pos[a].x-pos[b].x,dy=pos[a].y-pos[b].y,d2=dx*dx+dy*dy+1,d=Math.sqrt(d2);
  const push=1400/d2; disp[a].x+=push*dx/d;disp[a].y+=push*dy/d;disp[b].x-=push*dx/d;disp[b].y-=push*dy/d;}
 interactions.forEach(e=>{const a=pos[e.from],b=pos[e.to];if(!a||!b)return;const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+.01;
  const pull=(d-90)*0.012;disp[e.from].x+=pull*dx/d;disp[e.from].y+=pull*dy/d;disp[e.to].x-=pull*dx/d;disp[e.to].y-=pull*dy/d;});
 forces.forEach(f=>{const c=domainCenter[f.domain];disp[f.id].x+=(c.x-pos[f.id].x)*0.02;disp[f.id].y+=(c.y-pos[f.id].y)*0.02;});
 forces.forEach(f=>{pos[f.id].x+=Math.max(-8,Math.min(8,disp[f.id].x));pos[f.id].y+=Math.max(-8,Math.min(8,disp[f.id].y));});
}

const svg=document.getElementById("map");
function render(){
 const relAllowed=Object.fromEntries([...document.querySelectorAll(".rel")].map(c=>[c.value,c.checked]));
 const minLoad=+document.getElementById("load").value;
 const phase=document.getElementById("phase").value;
 const query=document.getElementById("search").value.toLowerCase();
 let edges="",nodes="";
 interactions.forEach(e=>{
  if(!relAllowed[e.relation]||e.load<minLoad)return;
  if(phase&&!e.sign_by_phase[phase])return;
  const a=pos[e.from],b=pos[e.to];if(!a||!b)return;
  const color=RELCOLOR[e.relation]||"#666";
  const dash=(e.relation==="substitutes"||e.relation==="competes_for")?"stroke-dasharray='5 4'":"";
  const width=Math.max(1,e.load*0.8);
  const opacity=e.load>=4?0.85:0.45;
  edges+=`<line class="edge" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="${width}" ${dash} style="stroke-opacity:${opacity}"><title>${e.from.split(':').slice(1).join(':')} ${e.relation} ${e.to.split(':').slice(1).join(':')} | ${e.channel} | kill: ${e.kill}</title></line>`;
 });
 forces.forEach(f=>{
  const hidden=query&&!(f.id+f.name+f.meaning).toLowerCase().includes(query);
  const p=pos[f.id];
  const sign=netSign(f);
  const r=6+Math.min(6,(f.out_interactions||0)/3);
  nodes+=`<g class="node${hidden?" hidden":""}" data-id="${f.id}"><circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${sign>0?"#3fb950":sign<0?"#f85149":"#8b949e"}"></circle><text x="${p.x+r+2}" y="${p.y+3}">${f.name}</text></g>`;
 });
 svg.innerHTML=`<g>${edges}${nodes}</g>`;
 svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
 svg.querySelectorAll(".node").forEach(g=>g.addEventListener("click",()=>show(g.dataset.id)));
}
function netSign(f){
 let s=0; interactions.forEach(e=>{if(e.from===f.id)s+=signFor(e);});
 return s;
}
function signFor(e){
 const dir={drives:1,amplifies:1,accelerates:1,feeds:1,prices:1,crowds_in:1,gates:-1,dampens:-1,delays:-1,
  substitutes:-1,competes_for:-1,crowds_out:-1,bounds:-1,invalidates:-1}[e.relation];
 return dir===undefined?0:dir;
}

 const chainList=chains.filter(c=>c.hops.includes(id)).map(c=>`<span class="pill" data-force="${c.hops[0]}">${c.title}</span>`).join(" ");
 document.getElementById("detail").innerHTML=`<h2>${f.name}</h2>
  <div class="card"><div>${f.meaning}</div><div class="why">${f.direction}</div>
  <div class="io"><div><span>domain</span> ${f.domain}</div><div><span>observables</span> ${f.observables}</div>
  <div><span>payer</span> ${f.payer}</div><div><span>net push</span> ${netSign(f)>0?"expands":netSign(f)<0?"contracts":"balanced"}</div></div></div>
  ${chainList?`<h3>chains</h3><div>${chainList}</div>`:""}
  <h3>pushes out (${out.length})</h3>${out.map(e=>card(e,false)).join("")}
  <h3>pushed by (${inc.length})</h3>${inc.map(e=>card(e,true)).join("")}
  ${mine.length?`<h3>assumptions it rests on</h3>${mine.map(a=>`<div class="card"><div>${a.statement}</div><div class="why">test: ${a.test} | kill: ${a.kill}</div></div>`).join("")}`:""}`;
 document.querySelectorAll("#detail .pill").forEach(p=>p.addEventListener("click",()=>{show(p.dataset.force);}));

document.getElementById("chains").innerHTML = chains.map(c=>`<div class="chain"><div><b>${c.title}</b>

document.querySelectorAll("#chains .pill").forEach(p=>p.addEventListener("click",()=>show(p.dataset.force)));

document.getElementById("matrix").innerHTML = `<table><thead><tr><th>force</th>${PHASES.map(p=>`<th>${p}</th>`).join("")}</tr></thead><tbody>`+
 matrixRows.map(f=>{const cells=PHASES.map(p=>{let s=0;interactions.forEach(e=>{if(e.from===f.id&&e.sign_by_phase[p])s+=signFor(e)*e.sign_by_phase[p];});
  return `<td class="${s>0?"pos":s<0?"neg":"zero"}">${s>0?"+":s<0?"-":"0"}</td>`;}).join("");
  return `<tr><td>${f.name}</td>${cells}</tr>`;}).join("")+"</tbody></table>";

document.getElementById("load").addEventListener("input",e=>{document.getElementById("loadval").textContent=e.target.value;render();});
["phase","search"].forEach(id=>document.getElementById(id).addEventListener("input",render));
document.querySelectorAll(".rel").forEach(c=>c.addEventListener("change",render));
render();
const first = interactions.sort((a,b)=>b.load-a.load)[0];
if(first) show(first.from);
</script></body></html>
